[project]
name = "nornir-infrahub"
version = "1.1.2"
description = "Nornir plugin for Infrahub"
authors = [{ name = "OpsMill", email = "info@opsmill.com" }]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10,<3.14"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "infrahub-sdk>=1.20.1,<2",
    "ruamel-yaml>=0.18.17,<0.20",
    "nornir>=3.5.0,<4",
    "nornir-utils>=0.2.0,<0.3",
    "python-slugify>=8.0.4,<9",
    "pydantic>=2.0.0,<3",
]

[project.urls]
Homepage = "https://opsmill.com"
Repository = "https://github.com/opsmill/nornir-infrahub"
Documentation = "https://docs.infrahub.app/"

[project.entry-points."nornir.plugins.inventory"]
InfrahubInventory = "nornir_infrahub.plugins.inventory.infrahub:InfrahubInventory"

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.14.10,<0.16",
    "ty>=0.0.1a11",
    "pytest-asyncio>=1.3.0,<2",
    "invoke>=2.2.0,<4",
    "yamllint>=1.37.1",
    "rumdl>=0.1.68,<1",
    "pre-commit>=4.0.0,<5",
    "pylint>=3.3.0,<5",
    "docstring-parser>=0.17,<0.19",
    "jinja2>=3.1.6,<4",
    "vale>=3.13.0.0,<4",
    "rich>=12,<16",  # Required by infrahub-sdk pytest plugin
    "pyyaml>=6,<7",  # Required by infrahub-sdk pytest plugin
    "infrahub-testcontainers>=1.9.3",
]

[tool.uv]
package = true

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_lines = ["if TYPE_CHECKING:", "raise NotImplementedError()"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore:pkg_resources is deprecated"]
# -p no:pytest-infrahub-performance-test disables a plugin from infrahub-testcontainers
# that crashes on Apple Silicon via psutil.cpu_freq() (psutil arm64 bug). Safe to remove
# if infrahub-testcontainers guards the call or psutil ships a fix.
addopts = "-vs -m 'not integration' -p no:pytest-infrahub-performance-test"
markers = ["integration: marks tests as integration tests (requires Docker)"]

[tool.ty.rules]
unresolved-import = "ignore"
# Infrahub SDK uses dynamic types that ty cannot fully understand without plugin support
invalid-argument-type = "ignore"
possibly-missing-attribute = "ignore"

[tool.pylint.general]
extension-pkg-whitelist = ["pydantic", "ujson"]

[tool.pylint.format]
disable = "logging-fstring-interpolation"

[tool.pylint.basic]
# No docstrings required for private methods (Pylint default), or for test_ functions.
no-docstring-rgx = "^(_|test_)"

[tool.pylint.messages_control]
# Line length is enforced by Black, so pylint doesn't need to check it.
# Pylint and Black disagree about how to format multi-line arrays; Black wins.
# assigning-non-slot,no-member,unsupported-membership-test,unsubscriptable-object,unsupported-assignment-operation,not-an-iterable
# are disabled because of our move to pydantic 2, pylint does not seem to respect the type hint for pydantic 2 model fields.
disable = """,
    line-too-long,
    missing-module-docstring,
    missing-function-docstring,
    missing-class-docstring,
    consider-using-from-import,
    invalid-name,
    too-many-arguments,
    too-many-locals,
    keyword-arg-before-vararg,
    too-few-public-methods,
    too-many-instance-attributes,
    fixme,
    consider-using-f-string,
    protected-access,
    import-self,
    wrong-import-order,
    assigning-non-slot,
    no-member,
    unsupported-membership-test,
    unsubscriptable-object,
    unsupported-assignment-operation,
    not-an-iterable,
    too-many-return-statements,
    unnecessary-comprehension,
    multiple-statements,
    self-assigning-variable,
    no-else-return,
    """

[tool.pylint.miscellaneous]
notes = """,
    FIXME,
    XXX,
    """

[tool.pylint.similarities]
min-similarity-lines = 20

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = [
    "C90",   # mccabe
    "ASYNC", # flake8-async
    "DTZ",   # flake8-datetimez
    "E",     # style errors
    "F",     # flakes
    "I",     # isort
    "ICN",   # flake8-import-conventions
    "TCH",   # flake8-type-checking
    "T10",   # flake8-debugger
    "PL",    # pylint
    "Q",     # flake8-quotes
    "W",     # pycodestyle
    "YTT",   # flake8-2020
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.isort]
known-third-party = ["nornir_infrahub"]

[tool.ruff.lint.per-file-ignores]
"tasks.py" = ["PLC0415"]  # Allow deferred imports in invoke tasks
"tests/**" = ["PLC0415", "PLR2004"]  # Allow deferred imports and magic numbers in tests
"nornir_infrahub/plugins/tasks/**" = [
    "PLR0911", # Nornir task functions return a failed Result at each guard
    "PLR0912", # Nornir task functions naturally branch on optional args
    "PLR0913", # Nornir task functions require many parameters
]

[tool.rumdl]
# Markdown linter/formatter (replaces markdownlint). Rule numbers are rumdl's own.
# The disable set carries over the rules the previous .markdownlint.yml turned off.
disable = [
    "MD012",  # Multiple blank lines — generated plugin reference docs emit them
    "MD013",  # Line length — long lines are fine in dev/ references and tables
    "MD014",  # Dollar signs before shell commands
    "MD029",  # Ordered-list prefix — allow manual numbering
    "MD033",  # Inline HTML — Docusaurus/MDX pages use it
    "MD034",  # Bare URLs — docstrings and READMEs contain them
    "MD041",  # First line need not be a top-level heading (MDX frontmatter/imports)
    "MD045",  # Image alt text
    "MD047",  # Single trailing newline
]
# Vendored/generated trees are pinned elsewhere (skills-lock.json, spec-kit) and must
# not be rewritten locally — exclude them like styrmin does.
exclude = [
    "node_modules",
    "docs/node_modules",
    ".venv",
    ".agents",               # vendored skills (spec-kit + opsmill-dev), pinned by skills-lock.json
    ".claude",               # symlink views of .agents
    ".specify/extensions",   # vendored spec-kit extensions
    ".specify/templates",    # vendored spec-kit templates
]

[tool.rumdl.per-file-ignores]
# AGENTS.md / CLAUDE.md are agent-instruction files, not published docs.
"**/AGENTS.md" = ["MD013", "MD024", "MD025", "MD029", "MD033", "MD041"]
# Plugin reference pages are generated from docstrings by `invoke generate-docs`;
# don't fight the renderer's alignment spacing.
"docs/docs/references/plugins/**" = ["MD064"]

# MD024: allow duplicate headings among siblings (e.g. repeated step headings in tabs)
[tool.rumdl.MD024]
siblings-only = true

# MD025: don't treat a frontmatter title as a competing H1
[tool.rumdl.MD025]
front-matter-title = ""

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

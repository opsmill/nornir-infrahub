---
ci_config: &ci_config
  - ".github/workflows/ci.yml"
  - ".github/file-filters.yml"

github_workflows: &github_workflows
  - ".github/workflows/*.yml"

doc_files: &doc_files
  - "docs/**"
  - package.json
  - package-lock.json

uv_all: &uv_all
  - pyproject.toml
  - uv.lock

python_all: &python_all
  - "**/*.py"
  # Lint results depend on these too: ruff/pylint/ty settings live in
  # pyproject.toml, and uv.lock pins the linter versions.
  - *uv_all

yaml_all: &yaml_all
  - "**/*.{yml,yaml}"

markdown_all:
  - "**/*.{md,mdx}"

documentation_all:
  - *doc_files

---
# yamllint disable rule:truthy
name: Publish release

# Fires when a release pull request lands on `stable`: creates the tag and
# publishes the GitHub Release whose body is the changelog section humans
# wrote, rather than a generated list of pull-request titles.
#
# The tag also triggers publish-to-pypi.yml because it is created with a PAT.
on:
  push:
    branches: [stable]

concurrency:
  # Serialize retries for one commit without replacing a pending run for a
  # different stable push. Each release merge must get its own publish attempt.
  group: release-publish-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Tag and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_UPDATE_PACKAGE_OTTO }}
          fetch-depth: 0
          fetch-tags: true

      - name: Decide whether this push is a release
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GH_UPDATE_PACKAGE_OTTO }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)

          # A retry after the tag push may find a tag but no GitHub Release.
          # Only a published Release makes this workflow complete.
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "v${VERSION} is already published."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            TAG_COMMIT=$(git rev-list -n 1 "v${VERSION}")
            if [ "${TAG_COMMIT}" != "${GITHUB_SHA}" ]; then
              echo "::error::v${VERSION} already tags a different commit."
              exit 1
            fi
          fi

          # A version on disk is not on its own an authorisation to release:
          # a direct version edit or dependency pull request would otherwise
          # cut a tag and a GitHub Release of its own accord. Publishing also
          # requires this commit to be the merge of a release pull request.
          RELEASE_PR=$(
            gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
              --jq '[.[]
                     | select(.merged_at != null)
                     | select(.head.ref | startswith("release/v"))
                     | .number] | first // empty'
          )

          if [ -z "${RELEASE_PR}" ]; then
            MSG="v${VERSION} is not published, but a version in"
            MSG="${MSG} pyproject.toml does not authorise a release."
            MSG="${MSG} ${GITHUB_SHA} is not the merge of a release/v*"
            MSG="${MSG} pull request, so no tag or GitHub Release was created."
            MSG="${MSG} Prepare the release with the Auto bump version workflow"
            MSG="${MSG} and merge its reviewed release pull request."
            echo "::notice::${MSG}"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "v${VERSION} authorised by merged release PR #${RELEASE_PR} — publishing."
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@v7
        if: steps.decide.outputs.publish == 'true'

      - name: Classify the release version
        id: classify
        if: steps.decide.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          set -euo pipefail
          uv run --no-project --with packaging python - <<'PY'
          import os

          from packaging.version import Version

          version = Version(os.environ["VERSION"])
          is_prerelease = version.is_prerelease or version.is_devrelease
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"prerelease={str(is_prerelease).lower()}\n")
          PY

      - name: Extract the changelog section
        if: steps.decide.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          set -euo pipefail

          # Everything from the first release heading after the towncrier
          # marker up to (but excluding) the next one — i.e. the section this
          # release just added.
          awk '
            /<!-- towncrier release notes start -->/ { seen = 1; next }
            seen && /^## / { if (started) exit; started = 1 }
            started { print }
          ' CHANGELOG.md > /tmp/release-body.md

          if [ ! -s /tmp/release-body.md ]; then
            echo "::error::Could not extract a changelog section for v${VERSION} from CHANGELOG.md."
            exit 1
          fi

          if ! head -n 1 /tmp/release-body.md | grep -Fq "/tree/v${VERSION})"; then
            MSG="The newest changelog section does not mention ${VERSION};"
            MSG="${MSG} refusing to publish mismatched notes."
            echo "::error::${MSG}"
            exit 1
          fi

          echo "Release body:"
          cat /tmp/release-body.md

      - name: Create the tag and the GitHub Release
        if: steps.decide.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_UPDATE_PACKAGE_OTTO }}
          VERSION: ${{ steps.decide.outputs.version }}
          IS_PRERELEASE: ${{ steps.classify.outputs.prerelease }}
        run: |
          set -euo pipefail

          if [ "${IS_PRERELEASE}" = "true" ]; then
            IS_LATEST=false
            RELEASE_FLAGS=(--prerelease)
          else
            # Mark only the highest full release as latest.
            RELEASED=$(gh release list --exclude-drafts --exclude-pre-releases \
              --limit 1000 --json tagName --jq '.[].tagName')
            HIGHEST=$(printf '%s\n%s\n' "${RELEASED}" "v${VERSION}" | sed '/^$/d; s/^v//' | sort -V | tail -n 1)
            if [ "${HIGHEST}" = "${VERSION}" ]; then
              IS_LATEST=true
            else
              IS_LATEST=false
            fi
            RELEASE_FLAGS=()
          fi
          echo "v${VERSION} prerelease=${IS_PRERELEASE} latest=${IS_LATEST}"

          # Push with a PAT so the existing tag-triggered PyPI workflow runs.
          # A rerun after a partial failure can reuse the tag and publish the
          # missing GitHub Release.
          if ! git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            git config user.name "opsmill-bot"
            git config user.email "opsmill-bot@users.noreply.github.com"
            git tag -a "v${VERSION}" -m "Release v${VERSION}"
            git push origin "v${VERSION}"
          fi

          gh release create "v${VERSION}" \
            --target "${GITHUB_SHA}" \
            --title "v${VERSION}" \
            --latest="${IS_LATEST}" \
            "${RELEASE_FLAGS[@]}" \
            --notes-file /tmp/release-body.md

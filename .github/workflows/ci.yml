---
# yamllint disable rule:truthy rule:truthy rule:line-length
name: "CI"
on:
  pull_request:
  push:
    branches:
      - develop
      - main
      - stable

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v3"
      - name: "Setup environment"
        run: |
          pipx install poetry
          pip install --upgrade invoke toml setuptools
      - name: "Install Linters"
        run: "poetry install --only=dev"
      - name: "Linting"
        run: "poetry run invoke lint"

  python-tests:
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
        experimental: [false]
        # Added experimental and python 3.12 due to upstream dependency in nornir.
        # This should be fixed once they release 3.5.0: https://github.com/nornir-automation/nornir/pull/981
        include:
          - python-version: "3.12"
            experimental: true
    if: |
      always() && !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    needs: ["lint"]
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v3"
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        id: python
        with:
          python-version: ${{ matrix.python-version }}
      - name: "Setup environment"
        run: |
          pipx install poetry
          pip install --upgrade invoke toml setuptools
        env:
          PIPX_DEFAULT_PYTHON: ${{ steps.python.outputs.python-path }}
      - name: "Install Nornir Infrahub"
        run: "poetry install --with=dev"
      - name: "Pytest Tests"
        run: "poetry run pytest -v tests/"


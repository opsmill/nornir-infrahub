---
# yamllint disable rule:truthy rule:truthy rule:line-length
name: "CI"
on:
  pull_request:
  push:
    branches:
      - develop
      - main
      - stable

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VALE_VERSION: "3.13.0"

jobs:
  files-changed:
    name: Detect which file has changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      documentation: ${{ steps.changes.outputs.documentation_all }}
      python: ${{ steps.changes.outputs.python_all }}
      uv: ${{ steps.changes.outputs.uv_all }}
      yaml: ${{ steps.changes.outputs.yaml_all }}
      markdown: ${{ steps.changes.outputs.markdown_all }}
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v7"
      - name: Check for file changes
        uses: opsmill/paths-filter@v3.0.2
        id: changes
        with:
          token: ${{ github.token }}
          filters: .github/file-filters.yml

  python-lint:
    if: needs.files-changed.outputs.python == 'true'
    needs: ["files-changed"]
    runs-on: "ubuntu-latest"
    strategy:
      matrix:
        python-version:
          - "3.14"
    timeout-minutes: 5
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v7"

      - name: "Set up Python ${{ matrix.python-version }}"
        uses: "actions/setup-python@v7"
        with:
          python-version: ${{ matrix.python-version }}

      - name: "Install uv"
        uses: "astral-sh/setup-uv@v7"
        with:
          version: "0.9.18"

      - name: "Install dependencies"
        run: "uv sync --group dev"

      - name: "Linting: ruff check"
        run: "uv run ruff check ."
      - name: "Linting: ruff format"
        run: "uv run ruff format --check --diff ."
      - name: "Type check with ty"
        run: "uv run ty check nornir_infrahub"
      - name: "Pylint Tests"
        run: "uv run pylint nornir_infrahub *.py"

  markdown-lint:
    if: needs.files-changed.outputs.markdown == 'true'
    needs: ["files-changed"]
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v7"

      - name: "Set up Python"
        uses: "actions/setup-python@v7"
        with:
          python-version: "3.14"

      - name: "Install uv"
        uses: "astral-sh/setup-uv@v7"
        with:
          version: "0.9.18"

      - name: "Install dependencies"
        run: "uv sync --group dev"

      - name: "Linting: rumdl"
        run: "uv run rumdl check ."

  yaml-lint:
    if: needs.files-changed.outputs.yaml == 'true'
    needs: ["files-changed"]
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v7"
      - name: "Install uv"
        uses: "astral-sh/setup-uv@v7"
        with:
          version: "0.9.18"
      - name: "Install dependencies"
        run: "uv sync --group dev"
      - name: "Linting: yamllint"
        run: "uv run yamllint -s ."

  python-tests:
    if: needs.files-changed.outputs.python == 'true' ||
        needs.files-changed.outputs.uv == 'true'
    needs: ["files-changed"]
    runs-on: "ubuntu-latest"
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    timeout-minutes: 30
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v7"

      - name: "Set up Python ${{ matrix.python-version }}"
        uses: "actions/setup-python@v7"
        with:
          python-version: ${{ matrix.python-version }}

      - name: "Install uv"
        uses: "astral-sh/setup-uv@v7"
        with:
          version: "0.9.18"

      - name: "Install dependencies"
        run: "uv sync --group dev"

      - name: "Pytest Tests"
        run: "uv run pytest -v tests/"

  # Integration tests start an Infrahub stack in Docker, so they run only on the
  # pull requests update-infrahub.yml opens for a new Infrahub version. Those
  # tests are the only check of the bump, and auto-merge-testcontainers.yml
  # merges the pull request only when this job passed. infrahub-sdk bumps
  # (update-infrahub-sdk-* and update-infrahub-<v>-sdk-<s>) do not run them.
  integration-test:
    if: >-
      github.event_name == 'pull_request' &&
      startsWith(github.head_ref, 'update-infrahub-') &&
      !startsWith(github.head_ref, 'update-infrahub-sdk-') &&
      !contains(github.head_ref, '-sdk-')
    runs-on: "ubuntu-latest"
    timeout-minutes: 60
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v7"

      - name: "Set up Python"
        uses: "actions/setup-python@v7"
        with:
          python-version: "3.14"

      - name: "Install uv"
        uses: "astral-sh/setup-uv@v7"
        with:
          version: "0.9.18"

      - name: "Install dependencies"
        run: "uv sync --group dev"

      # `-m integration` on the command line replaces the `-m 'not integration'`
      # default from addopts in pyproject.toml.
      - name: "Integration tests"
        run: "uv run pytest -v -m integration tests/integration"

  # coverall-report:
  #   needs: ["python-tests"]
  #   if: |
  #     always() && !cancelled()
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 10
  #   steps:
  #     - uses: coverallsapp/github-action@v2
  #       env:
  #         COVERALLS_SERVICE_NUMBER: ${{ github.sha }}
  #       with:
  #         carryforward: "nornir-unit"
  #         parallel-finished: true

  documentation:
    defaults:
      run:
        working-directory: ./docs
    if: |
      always() && !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      needs.files-changed.outputs.documentation == 'true'
    needs: ["files-changed", "yaml-lint", "python-lint", "markdown-lint"]
    runs-on: "ubuntu-22.04"
    timeout-minutes: 5
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v7"
        with:
          submodules: true
      - name: Install NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json
      - name: "Install dependencies"
        run: npm install
      - name: "Install uv"
        uses: "astral-sh/setup-uv@v7"
        with:
          version: "0.9.18"
      - name: "Install Python dependencies"
        run: "uv sync --group dev"
        working-directory: ./
      - name: "Generate docs"
        run: "uv run invoke generate-docs"
        working-directory: ./
      - name: "Build docs website"
        run: "uv run invoke docs-build"
        working-directory: ./

  validate-documentation-style:
    if: |
      always() && !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      needs.files-changed.outputs.documentation == 'true'
    needs: ["files-changed", "yaml-lint", "python-lint", "markdown-lint"]
    runs-on: "ubuntu-22.04"
    timeout-minutes: 5
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v7"
        with:
          submodules: true

      # The official GitHub Action for Vale doesn't work, installing manually instead:
      # https://github.com/errata-ai/vale-action/issues/103
      - name: Download Vale
        run: |
          curl -sL "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" -o vale.tar.gz
          tar -xzf vale.tar.gz
        env:
          VALE_VERSION: ${{ env.VALE_VERSION }}
      - name: "Validate documentation style"
        run: ./vale $(find ./docs/docs -type f \( -name "*.mdx" -o -name "*.md" \) )
